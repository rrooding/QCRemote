# C++23, no exceptions/RTTI - see CODING_STANDARDS.md's Firmware section.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Zephyr defaults to MINIMAL_LIBCPP (no <span>, no STL) unless asked
# otherwise - not enough for this codebase (std::span, ETL, etc.). Selects
# GLIBCXX_LIBCPP given picolibc + the zephyr/gnu toolchain (lib/cpp/Kconfig).
CONFIG_REQUIRES_FULL_LIBCPP=y

# Heartbeat LED sanity check
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# USB host [EXPERIMENTAL] - see ADR 0002 for the accepted risk. Enumerates
# the Quad Cortex Mini and claims its vendor HID interface (issue #3). Pulls
# in UHC_DRIVER; the NXP EHCI controller driver auto-selects itself once
# boards/frdm_rw612.overlay enables the usbh devicetree node.
CONFIG_USB_HOST_STACK=y

# Zephyr's own internal `usbh` thread (the same one that runs
# onProbe()/onReportIn(), see UsbHostClass.hpp) defaults to a 1024-byte
# stack (subsys/usb/host/Kconfig's CONFIG_USBH_STACK_SIZE) - a logging call
# added there during issue #8's hardware debugging (since removed, see
# QcSession.hpp's handleMessage()) overflowed it, confirmed via addr2line
# against the faulting PC/LR. With that logging gone for good,
# Zephyr's THREAD_ANALYZER measured this thread's real peak usage on
# hardware at 736 bytes; 1536 keeps that at just under half of budget
# rather than carrying forward the earlier emergency doubling to 2048 now
# that there's a real number to size against.
CONFIG_USBH_STACK_SIZE=1536

# So a future fault dump names the thread involved instead of "(unknown)" -
# this was off during issue #8's hardware debugging, which is also why
# Zephyr's own k_thread_name_set(&usbh_thread_data, "usbh") (usbh_core.c)
# and our own k_thread_name_set() calls (QcSession.hpp) weren't showing up
# in a fault dump either.
CONFIG_THREAD_NAME=y

# Issue #71: Wi-Fi + the web/WebSocket transport test - see ADR 0010.
# CONFIG_WIFI_USAGE_MODE_AP/STA itself (and real SSID/PSK) are chosen in a
# local, untracked wifi_credentials.conf (see wifi_credentials.conf.example
# and firmware/README.md) - everything below is the always-on plumbing
# that choice depends on either way, so it's committed. The Wi-Fi driver
# and its own settings are per board: boards/frdm_rw612.conf (NXP driver,
# which also runs the SoftAP's DHCPv4 server) and
# boards/esp32s3_devkitc_esp32s3_procpu.conf (ESP32 driver; the app runs
# the SoftAP's DHCPv4 server - CONFIG_QC_WIFI_AP_APP_DHCP_SERVER).
CONFIG_WIFI=y
CONFIG_ETH_DRIVER=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# STA mode: CONFIG_WIFI_STA_AUTO_DHCPV4 (subsys/net/l2/wifi/Kconfig,
# default y) starts the DHCPv4 client automatically once connected - no
# app code needed. AP mode: hardware testing on ac601b2 found that the NXP
# driver's own CONFIG_NXP_WIFI_SOFTAP_DHCP_SERVER DOES auto-start a
# DHCPv4 server for SoftAP - confirmed against drivers/wifi/nxp/src/
# nxp_wifi_drv.c's WLAN_REASON_UAP_SUCCESS handler, which this firmware's
# own now-removed app-layer DHCPv4 server start was conflicting with
# (-EALREADY, logged as nxp_wifi's "DHCP Server start failed" on
# hardware). CONFIG_NET_DHCPV4_SERVER itself is selected transitively by
# CONFIG_NXP_WIFI_SOFTAP_DHCP_SERVER on the RW612, and by the app's own
# CONFIG_QC_WIFI_AP_APP_DHCP_SERVER on other drivers (both only in AP
# mode) - no need to set it here, and station-only builds never pull it
# in since they have no DHCP server to run.
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# QcWifiWebTransport::onWifiEvent() reads net_mgmt_event_callback::info
# (e.g. the joining/leaving station's MAC in NET_EVENT_WIFI_AP_STA_*) -
# that field only exists when this is enabled.
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
# NET_PKT_{RX,TX}_COUNT and the net_buf counts are set with the TCP
# window budget further down - see CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE.
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Issue #71 hardware finding (26bfec1): root cause of the rx_q[0] stack-
# overflow usage fault on page load, in both AP and station mode, with or
# without a Quad Cortex attached - confirmed from source and from this
# build's own zephyr.elf, not our own code. Enabling Wi-Fi here pulls in
# CONFIG_PSA_CRYPTO + CONFIG_MCUX_ELS_PKC (the Wi-Fi driver's own security
# needs); subsys/net/ip/Kconfig.tcp's CONFIG_NET_TCP_ISN_RFC6528 ("depends
# on PSA_WANT_ALG_SHA_256", default y) silently flips on as a result - it's
# off on master today precisely because that dependency isn't met there.
# Once on, every newly-accepted TCP connection's initial sequence number
# (subsys/net/ip/tcp.c's tcp_isn_hash(), called inline during SYN
# processing on net_tc's own "rx_q[N]" thread - confirmed at net_tc.c:421)
# computes a real SHA-256 via psa_hash_compute() -> the hardware-backed
# ELS/PKC driver -> NXP's mcuxCl hash library, instead of master's shallow
# sys_rand32_get() fallback. Measured on this build's zephyr.elf (gcc
# prologue push+sub sp, same per-frame method as every other stack-margin
# table in this firmware): tcp_isn_hash (56 B) -> psa_hash_compute (tail
# call, net 0 B) -> psa_driver_wrapper_hash_compute (40 B) ->
# els_pkc_transparent_hash_compute (32 B) ->
# mcuxClPsaDriver_psa_driver_wrapper_hash_compute (296 B) ->
# mcuxClHash_compute (120 B) -> mcuxClHashModes_Els_oneShot_Sha2 (152 B) ->
# its _FullBlocks/_ProcessData/_Truncated callee (108-240 B depending on
# input length) -> mcuxClHashModes_Els_oneShot_Sha2_Padding (120 B) ->
# mcuxClMemory_copy (80 B, where the fault PC/LR from both hardware runs
# land - 0x18006dba/0x18004db5 on this build) = ~1136 B for this chain
# alone, on top of whatever net_tc/IP/TCP processing it took to reach SYN
# handling in the first place - loading the page's first new TCP
# connection (the fetch and/or the WebSocket upgrade) is what triggers it,
# which is why an empty catalog and no USB device still crash identically.
# CONFIG_NET_RX_STACK_SIZE's own default (1500 B, matching the "1504"
# thread_analyzer budget on hardware) was sized for the pre-Wi-Fi,
# non-cryptographic ISN path and was never going to survive this chain.
# Doubled to a round 3072 B - leaves real headroom (the chain above is the
# deepest path this thread takes; ordinary packet forwarding is far
# shallower) without the much larger jump a "disable the fancy ISN
# instead" workaround would have avoided needing. Unverified on hardware -
# needs a fresh flash to confirm (see firmware/README.md).
CONFIG_NET_RX_STACK_SIZE=3072

# Zephyr's HTTP server [EXPERIMENTAL] + its websocket upgrade path -
# issue #71's "minimal page and a WebSocket" requirement
# (QcWifiWebTransport.hpp). CONFIG_HTTP_SERVER_WEBSOCKET selects
# WEBSOCKET_CLIENT (the same library backs both directions of the
# protocol).
#
# WEBSOCKET_MAX_CONTEXTS=1, matching QcWifiWebTransport's own
# kMaxWsClients - issue #75 / ADR 0011: Zephyr hands this resource's one
# static data_buffer (g_qcWsDataBuffer) to websocket_register() on every
# upgrade, so a second concurrent context would share that buffer with the
# first and could corrupt its partially received frames (confirmed against
# the pinned v4.5.0 tree - see kMaxWsClients' own comment in
# QcWifiWebTransport.hpp). Capping this at 1 makes Zephyr itself refuse a
# second concurrent upgrade before any of our own code runs, which is
# simpler and provably safe compared to juggling a second resource/buffer
# pair for a feature (two simultaneous live clients) nothing has asked
# for.
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
# Eight, after 13 regressed the board (PR #92, third round). 6 for a
# browser's own per-host connection cap + 1 for a transient WebSocket
# upgrade (which holds a slot only until
# handle_http1_to_websocket_upgrade() hands the socket off) + 1 spare.
#
# 13 was sized for two browsers' *parked* connections and made hardware
# strictly worse: Chrome went from loading fine to hanging, with one
# module eventually RST mid-response after 45s. Parked idle connections
# cost a slot but no network buffers; connections being *served* cost
# both, and the server accepts up to this many, so this number also caps
# how many sends can be in flight at once - which is what the TCP window
# budget below has to cover. Accepting more connections than the link's
# buffer budget can serve turns a queue into a stall. Two browsers at
# once is handled by recycling parked slots quickly (the inactivity
# timeout below) rather than by holding a slot open for each.
CONFIG_HTTP_SERVER_MAX_CLIENTS=8

# Halved from Zephyr's default of 10 (and matching its own
# HTTP_SERVER_VERSION_3 default), so a parked keep-alive connection
# recycles its slot in 5s rather than 10. Zephyr's server never sends
# Connection: close, and the timer is armed in init_client_ctx() and
# restarted only on a data event, so an *idle* connection otherwise holds
# its slot for the full timeout after its last request - which is how a
# second browser (or the same one reloading) got locked out behind the
# first. Deliberately not cut further: at 2s,
# tests/wifi_web_http's test_presets_json_on_same_keep_alive_connection
# starts failing, because the server drops the connection between the
# page request and the script's own fetch on it - a real regression for
# keep-alive reuse, not a test artifact.
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=5

# PR #92's third round, and the one that only shows up on real hardware.
# Symptom: with the two fixes below already in place, a page load served
# its first few files in 11-30ms each and then stalled on the parallel
# wave - three modules finally arriving at ~20s and the fourth getting
# "200 OK" and then an RST mid-response at 45s, with 0.1 kB transferred,
# so the import graph never resolved. It got *worse* when
# HTTP_SERVER_MAX_CLIENTS went from 6 to 13, which is the clue: the
# binding resource scales with the number of connections being served at
# once, not with slots.
#
# Root cause, from subsys/net/ip/tcp.c's own window initialisation:
#
#   tcp_tx_window = (CONFIG_NET_BUF_TX_COUNT * CONFIG_NET_BUF_DATA_SIZE) / 3
#
# when CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE is 0 (its default), and the
# same shape for tcp_rx_window out of the RX pool. That is **one third of
# the entire pool, applied per connection** - so any more than three
# concurrently-sending connections oversubscribes the pool *by
# construction*, no matter how big the pool is. Raising the buffer counts
# alone cannot fix it; it raises the per-connection window by exactly the
# same factor. The window has to be pinned.
#
# With this board's previous NET_BUF_TX_COUNT=36 (Zephyr's own
# NET_PKT_LARGE_DEFAULTS value, on because CONFIG_WIFI is set) and
# NET_BUF_DATA_SIZE=128, that was a 1536-byte window per connection
# against a 4608-byte pool: 2x oversubscribed at 6 clients, 4.3x at 13.
# TCP holds a segment's buffers until it is ACKed, so on a real Wi-Fi
# link (the owner measured 25-150ms RTT) they stay held for a whole round
# trip and the pool genuinely runs dry - the send then stalls, and the
# connection ends in a reset rather than an error the client can retry.
#
# This is exactly why tests/wifi_web_http passes off-board while the
# board fails: over loopback the RTT is microseconds, so a buffer is
# allocated, sent, ACKed and freed before anything else needs it, and the
# oversubscription never bites. That difference - not buffer counts, not
# the poll limits - is what the loopback suite cannot model, and it is
# worth remembering before trusting it about anything throughput-related.
#
# The budget, written out so it can be checked rather than tuned:
#   - 2048 B window per connection: at a 100ms RTT that is ~20 KB/s, so
#     the largest asset (vendor/lit.js, 7053 B gzipped) takes ~0.35s, and
#     a whole 6-file wave ~2s even if the server serialises them (it has
#     one thread, so it does).
#   - 8 connections x 2048 B = 16384 B of TX data in flight, worst case.
#   - 160 TX buffers x 128 B = 20480 B, i.e. 1.25x that budget.
#   - RX is deliberately smaller (96 x 128 B = 12288 B): the inbound
#     direction only carries request headers (~600 B each) and ACKs, so
#     the advertised receive window is headroom this firmware never
#     fills, not a throughput constraint.
#   - NET_PKT_{TX,RX}_COUNT 24: a 2048 B window is ~2 segments at this
#     MTU, so 8 connections need ~16 pending sends plus ACKs.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=2048
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2048
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24

# PR #92's hardware blocker (issue #88), the original root cause. Zephyr's
# HTTP server watches all of its descriptors in a single zsock_poll()
# call - 1 eventfd + one listening socket + CONFIG_HTTP_SERVER_MAX_CLIENTS
# accepted sockets (subsys/net/lib/http/http_server_core.c's
# HTTP_SERVER_SOCK_COUNT and the zsock_poll() in http_server_run()). Each
# *active* descriptor in that call needs one entry in
# zvfs_poll_internal()'s own `struct k_poll_event
# poll_events[CONFIG_ZVFS_POLL_MAX]` (lib/os/zvfs/zvfs_poll.c), and
# zsock_poll_prepare_ctx() returns -ENOMEM the moment it runs out
# (subsys/net/lib/sockets/sockets_inet.c). CONFIG_ZVFS_POLL_MAX's own
# default is 3 (lib/os/zvfs/Kconfig; the larger "6 if
# WIFI_NM_WPA_SUPPLICANT" default does not apply - this build uses the
# NXP driver, confirmed against its own .config), which is eventfd +
# listener + exactly *one* client. So a second simultaneous connection
# made poll() fail, and http_server_run() treats a poll() failure as
# fatal: close_all_sockets() drops every live connection *and* the
# listening socket, then the thread re-inits after
# CONFIG_HTTP_SERVER_RESTART_DELAY (1s). That is precisely the owner's
# first curl result on hardware - sequential requests all 200, two or
# more in parallel mostly reset (56) / empty reply (52) / refused (7),
# the last being connects that land inside the 1s restart window. It
# stayed hidden because the old inline page only ever made sequential
# requests.
#
# Needed: 1 + 1 + CONFIG_HTTP_SERVER_MAX_CLIENTS = 10. This is a *stack*
# array in whichever thread calls poll(), ~20 bytes per entry on
# Cortex-M - it costs no static RAM. Kept exactly at the requirement
# rather than padded: CONFIG_HTTP_SERVER_STACK_SIZE is only 3072 bytes,
# and this array lives on it.
CONFIG_ZVFS_POLL_MAX=10

# The pools a parallel page load draws from, which the defaults left with
# no room either. Every TCP connection takes one net_context and
# registers one net_conn 5-tuple handler (subsys/net/ip/tcp.c's
# tcp_conn_new()), and when either pool is empty the SYN gets an RST
# straight back (net_tcp_reply_rst() on the tcp_conn_new() failure path) -
# the same curl 56 as above, from a different cause. Needed: 1 listening
# socket + 8 accepted + 1 for the DHCPv4 client = 10, against defaults of
# 6 and 8, with nothing left for a closed connection still sitting in
# TIME_WAIT (CONFIG_NET_TCP_TIME_WAIT_DELAY is 1500ms, and a page reload
# closes and reopens a whole browser's worth at once). 14/18 leaves that
# headroom.
#
# CONFIG_ZVFS_OPEN_MAX is deliberately not set: it defaults to the sum of
# the subsystems' own requirements, and ZVFS_OPEN_ADD_SIZE_NET follows
# NET_MAX_CONTEXTS (subsys/net/ip/Kconfig), so the file-descriptor table
# grows with the line below to 14 + 1 - comfortably past the 11 the
# server needs (eventfd + listener + 8 clients + the one WebSocket fd).
CONFIG_NET_MAX_CONTEXTS=14
CONFIG_NET_MAX_CONN=18
CONFIG_WEBSOCKET_MAX_CONTEXTS=1
# Issue #71's 5068403 smoke test: without this, a *dynamic* resource's
# response line is "HTTP/1.1 200\r\n" - subsys/net/lib/http/
# http_server_http1.c's RESPONSE_TEMPLATE_DYNAMIC_PART1 is
# "HTTP/1.1 %d%s%s\r\n" and both %s are empty when this is off, so even
# the space after the status code is missing. RFC 9112 section 4 makes
# that space mandatory (the reason phrase itself may be empty), so the
# only response in this firmware that a browser rejected was also the
# only one not sending a well-formed status line - the static page
# resource sends a hardcoded "HTTP/1.1 200 OK". Zephyr's own help text
# for this option says the absence "does not affect protocol compliance
# or client behavior", which is what the generated line above
# contradicts. Costs a small string table.
