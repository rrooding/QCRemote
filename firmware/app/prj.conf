# C++23, no exceptions/RTTI - see CODING_STANDARDS.md's Firmware section.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Zephyr defaults to MINIMAL_LIBCPP (no <span>, no STL) unless asked
# otherwise - not enough for this codebase (std::span, ETL, etc.). Selects
# GLIBCXX_LIBCPP given picolibc + the zephyr/gnu toolchain (lib/cpp/Kconfig).
CONFIG_REQUIRES_FULL_LIBCPP=y

# Heartbeat LED sanity check
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# USB host [EXPERIMENTAL] - see ADR 0002 for the accepted risk. Enumerates
# the Quad Cortex Mini and claims its vendor HID interface (issue #3). Pulls
# in UHC_DRIVER; the NXP EHCI controller driver auto-selects itself once
# boards/frdm_rw612.overlay enables the usbh devicetree node.
CONFIG_USB_HOST_STACK=y

# Zephyr's own internal `usbh` thread (the same one that runs
# onProbe()/onReportIn(), see UsbHostClass.hpp) defaults to a 1024-byte
# stack (subsys/usb/host/Kconfig's CONFIG_USBH_STACK_SIZE) - a logging call
# added there during issue #8's hardware debugging (since removed, see
# QcSession.hpp's handleMessage()) overflowed it, confirmed via addr2line
# against the faulting PC/LR. With that logging gone for good,
# Zephyr's THREAD_ANALYZER measured this thread's real peak usage on
# hardware at 736 bytes; 1536 keeps that at just under half of budget
# rather than carrying forward the earlier emergency doubling to 2048 now
# that there's a real number to size against.
CONFIG_USBH_STACK_SIZE=1536

# So a future fault dump names the thread involved instead of "(unknown)" -
# this was off during issue #8's hardware debugging, which is also why
# Zephyr's own k_thread_name_set(&usbh_thread_data, "usbh") (usbh_core.c)
# and our own k_thread_name_set() calls (QcSession.hpp) weren't showing up
# in a fault dump either.
CONFIG_THREAD_NAME=y

# Issue #71: Wi-Fi + the web/WebSocket transport test - see ADR 0010.
# CONFIG_WIFI_USAGE_MODE_AP/STA itself (and real SSID/PSK) are chosen in a
# local, untracked wifi_credentials.conf (see wifi_credentials.conf.example
# and firmware/README.md) - everything below is the always-on plumbing
# that choice depends on either way, so it's committed. The Wi-Fi driver
# and its own settings are per board: boards/frdm_rw612.conf (NXP driver,
# which also runs the SoftAP's DHCPv4 server) and
# boards/esp32s3_devkitc_esp32s3_procpu.conf (ESP32 driver; the app runs
# the SoftAP's DHCPv4 server - CONFIG_QC_WIFI_AP_APP_DHCP_SERVER).
CONFIG_WIFI=y
CONFIG_ETH_DRIVER=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# STA mode: CONFIG_WIFI_STA_AUTO_DHCPV4 (subsys/net/l2/wifi/Kconfig,
# default y) starts the DHCPv4 client automatically once connected - no
# app code needed. AP mode: hardware testing on ac601b2 found that the NXP
# driver's own CONFIG_NXP_WIFI_SOFTAP_DHCP_SERVER DOES auto-start a
# DHCPv4 server for SoftAP - confirmed against drivers/wifi/nxp/src/
# nxp_wifi_drv.c's WLAN_REASON_UAP_SUCCESS handler, which this firmware's
# own now-removed app-layer DHCPv4 server start was conflicting with
# (-EALREADY, logged as nxp_wifi's "DHCP Server start failed" on
# hardware). CONFIG_NET_DHCPV4_SERVER itself is selected transitively by
# CONFIG_NXP_WIFI_SOFTAP_DHCP_SERVER on the RW612, and by the app's own
# CONFIG_QC_WIFI_AP_APP_DHCP_SERVER on other drivers (both only in AP
# mode) - no need to set it here, and station-only builds never pull it
# in since they have no DHCP server to run.
CONFIG_NET_DHCPV4=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# QcWifiWebTransport::onWifiEvent() reads net_mgmt_event_callback::info
# (e.g. the joining/leaving station's MAC in NET_EVENT_WIFI_AP_STA_*) -
# that field only exists when this is enabled.
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Issue #71 hardware finding (26bfec1): root cause of the rx_q[0] stack-
# overflow usage fault on page load, in both AP and station mode, with or
# without a Quad Cortex attached - confirmed from source and from this
# build's own zephyr.elf, not our own code. Enabling Wi-Fi here pulls in
# CONFIG_PSA_CRYPTO + CONFIG_MCUX_ELS_PKC (the Wi-Fi driver's own security
# needs); subsys/net/ip/Kconfig.tcp's CONFIG_NET_TCP_ISN_RFC6528 ("depends
# on PSA_WANT_ALG_SHA_256", default y) silently flips on as a result - it's
# off on master today precisely because that dependency isn't met there.
# Once on, every newly-accepted TCP connection's initial sequence number
# (subsys/net/ip/tcp.c's tcp_isn_hash(), called inline during SYN
# processing on net_tc's own "rx_q[N]" thread - confirmed at net_tc.c:421)
# computes a real SHA-256 via psa_hash_compute() -> the hardware-backed
# ELS/PKC driver -> NXP's mcuxCl hash library, instead of master's shallow
# sys_rand32_get() fallback. Measured on this build's zephyr.elf (gcc
# prologue push+sub sp, same per-frame method as every other stack-margin
# table in this firmware): tcp_isn_hash (56 B) -> psa_hash_compute (tail
# call, net 0 B) -> psa_driver_wrapper_hash_compute (40 B) ->
# els_pkc_transparent_hash_compute (32 B) ->
# mcuxClPsaDriver_psa_driver_wrapper_hash_compute (296 B) ->
# mcuxClHash_compute (120 B) -> mcuxClHashModes_Els_oneShot_Sha2 (152 B) ->
# its _FullBlocks/_ProcessData/_Truncated callee (108-240 B depending on
# input length) -> mcuxClHashModes_Els_oneShot_Sha2_Padding (120 B) ->
# mcuxClMemory_copy (80 B, where the fault PC/LR from both hardware runs
# land - 0x18006dba/0x18004db5 on this build) = ~1136 B for this chain
# alone, on top of whatever net_tc/IP/TCP processing it took to reach SYN
# handling in the first place - loading the page's first new TCP
# connection (the fetch and/or the WebSocket upgrade) is what triggers it,
# which is why an empty catalog and no USB device still crash identically.
# CONFIG_NET_RX_STACK_SIZE's own default (1500 B, matching the "1504"
# thread_analyzer budget on hardware) was sized for the pre-Wi-Fi,
# non-cryptographic ISN path and was never going to survive this chain.
# Doubled to a round 3072 B - leaves real headroom (the chain above is the
# deepest path this thread takes; ordinary packet forwarding is far
# shallower) without the much larger jump a "disable the fancy ISN
# instead" workaround would have avoided needing. Unverified on hardware -
# needs a fresh flash to confirm (see firmware/README.md).
CONFIG_NET_RX_STACK_SIZE=3072

# Zephyr's HTTP server [EXPERIMENTAL] + its websocket upgrade path -
# issue #71's "minimal page and a WebSocket" requirement
# (QcWifiWebTransport.hpp). CONFIG_HTTP_SERVER_WEBSOCKET selects
# WEBSOCKET_CLIENT (the same library backs both directions of the
# protocol); WEBSOCKET_MAX_CONTEXTS must cover QcWifiWebTransport's own
# kMaxWsClients (2).
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_WEBSOCKET_MAX_CONTEXTS=2
