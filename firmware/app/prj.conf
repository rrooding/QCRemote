# C++23, no exceptions/RTTI - see CODING_STANDARDS.md's Firmware section.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Zephyr defaults to MINIMAL_LIBCPP (no <span>, no STL) unless asked
# otherwise - not enough for this codebase (std::span, ETL, etc.). Selects
# GLIBCXX_LIBCPP given picolibc + the zephyr/gnu toolchain (lib/cpp/Kconfig).
CONFIG_REQUIRES_FULL_LIBCPP=y

# Heartbeat LED sanity check
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# USB host [EXPERIMENTAL] - see ADR 0002 for the accepted risk. Enumerates
# the Quad Cortex Mini and claims its vendor HID interface (issue #3). Pulls
# in UHC_DRIVER; the NXP EHCI controller driver auto-selects itself once
# boards/frdm_rw612.overlay enables the usbh devicetree node.
CONFIG_USB_HOST_STACK=y

# Found via a real hardware crash while debugging issue #8: Zephyr's own
# internal `usbh` thread (the same one that runs onProbe()/onReportIn(),
# see UsbHostClass.hpp) defaults to a 1024-byte stack
# (subsys/usb/host/Kconfig's CONFIG_USBH_STACK_SIZE), and that was already
# running close to the edge for the reassembly + dispatch work this
# firmware does from on_report_in() - one additional LOG_INF call there
# (since reverted, see QcSession.hpp's handleMessage()) was enough to
# overflow it (confirmed via addr2line against the faulting PC/LR:
# lib/libc/picolibc/cbprintf.c's cbputc, and the faulting thread's TCB
# address matching usbh_core.c's static usbh_thread_data). Doubled for
# headroom; not independently measured on hardware beyond "doesn't repeat
# the crash that prompted this".
CONFIG_USBH_STACK_SIZE=2048

# So fault dumps name the thread that crashed instead of "(unknown)" -
# CONFIG_THREAD_NAME was off, which is also why Zephyr's own
# k_thread_name_set(&usbh_thread_data, "usbh") (usbh_core.c) and our own
# k_thread_name_set() calls (QcSession.hpp) weren't showing up above.
CONFIG_THREAD_NAME=y

# Periodic per-thread stack usage report (issue #8's hardware debugging) -
# covers every thread, ours and Zephyr's internal ones (usbh included),
# not just the ones we instrumented by hand. THREAD_ANALYZER_AUTO_STACK_SIZE
# is bumped for the same cbprintf-depth reason CONFIG_USBH_STACK_SIZE was
# above - its own default (1024 under our LOG_MODE_IMMEDIATE config) is the
# same size that just overflowed.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048
