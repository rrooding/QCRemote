# C++23, no exceptions/RTTI - see CODING_STANDARDS.md's Firmware section.
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Zephyr defaults to MINIMAL_LIBCPP (no <span>, no STL) unless asked
# otherwise - not enough for this codebase (std::span, ETL, etc.). Selects
# GLIBCXX_LIBCPP given picolibc + the zephyr/gnu toolchain (lib/cpp/Kconfig).
CONFIG_REQUIRES_FULL_LIBCPP=y

# Heartbeat LED sanity check
CONFIG_GPIO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# USB host [EXPERIMENTAL] - see ADR 0002 for the accepted risk. Enumerates
# the Quad Cortex Mini and claims its vendor HID interface (issue #3). Pulls
# in UHC_DRIVER; the NXP EHCI controller driver auto-selects itself once
# boards/frdm_rw612.overlay enables the usbh devicetree node.
CONFIG_USB_HOST_STACK=y

# Zephyr's own internal `usbh` thread (the same one that runs
# onProbe()/onReportIn(), see UsbHostClass.hpp) defaults to a 1024-byte
# stack (subsys/usb/host/Kconfig's CONFIG_USBH_STACK_SIZE) - a logging call
# added there during issue #8's hardware debugging (since removed, see
# QcSession.hpp's handleMessage()) overflowed it, confirmed via addr2line
# against the faulting PC/LR. With that logging gone for good,
# Zephyr's THREAD_ANALYZER measured this thread's real peak usage on
# hardware at 736 bytes; 1536 keeps that at just under half of budget
# rather than carrying forward the earlier emergency doubling to 2048 now
# that there's a real number to size against.
CONFIG_USBH_STACK_SIZE=1536

# So a future fault dump names the thread involved instead of "(unknown)" -
# this was off during issue #8's hardware debugging, which is also why
# Zephyr's own k_thread_name_set(&usbh_thread_data, "usbh") (usbh_core.c)
# and our own k_thread_name_set() calls (QcSession.hpp) weren't showing up
# in a fault dump either.
CONFIG_THREAD_NAME=y

# Issue #71: Wi-Fi + the web/WebSocket transport test - see ADR 0009.
# CONFIG_WIFI_USAGE_MODE_AP/STA itself (and real SSID/PSK) are chosen in a
# local, untracked wifi_credentials.conf (see wifi_credentials.conf.example
# and firmware/README.md) - everything below is the always-on plumbing
# that choice depends on either way, so it's committed. Modeled on Zephyr's
# own samples/net/wifi/apsta_mode sample + its boards/frdm_rw612.conf
# (CONFIG_WIFI_NXP/CONFIG_NXP_RW610 - RW610 and RW612 share the same
# wifi/BLE/802.15.4 radio silicon, Kconfig only distinguishes by that
# radio, not the MCU's own flash/pin variant), the only sample confirmed
# (via Zephyr's own test plan, samples/net/wifi/shell/tests.yaml) to build
# for this board. CONFIG_NXP_WIFI_SOFTAP_SUPPORT and the AP-mode DHCPv4
# address pool (32 addresses, soc/nxp/rw/Kconfig.defconfig.wifi) default
# on for this SoC series once WIFI_USAGE_MODE_AP/STA_AP is selected - no
# need to set them here.
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
CONFIG_ETH_DRIVER=n

CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
# STA mode: CONFIG_WIFI_STA_AUTO_DHCPV4 (subsys/net/l2/wifi/Kconfig,
# default y) starts the DHCPv4 client automatically once connected - no
# app code needed. AP mode: the NXP driver does *not* auto-start a DHCPv4
# server (confirmed against its source, drivers/wifi/nxp/src/nxp_wifi_net.c)
# - QcWifiWebTransport::startAccessPoint() sets a static IP and starts one
# itself, same as the apsta_mode sample's enable_dhcpv4_server().
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_IF_MAX_IPV4_COUNT=2
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# QcWifiWebTransport::onWifiEvent() reads net_mgmt_event_callback::info
# (e.g. the joining/leaving station's MAC in NET_EVENT_WIFI_AP_STA_*) -
# that field only exists when this is enabled.
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096

# Zephyr's HTTP server [EXPERIMENTAL] + its websocket upgrade path -
# issue #71's "minimal page and a WebSocket" requirement
# (QcWifiWebTransport.hpp). CONFIG_HTTP_SERVER_WEBSOCKET selects
# WEBSOCKET_CLIENT (the same library backs both directions of the
# protocol); WEBSOCKET_MAX_CONTEXTS must cover QcWifiWebTransport's own
# kMaxWsClients (2).
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=4
CONFIG_WEBSOCKET_MAX_CONTEXTS=2

# Hardware-margin visibility for this test build (issue #71's measure-and-
# report requirement) - periodic real per-thread stack high-water marks
# via CONFIG_THREAD_ANALYZER_AUTO, no app code needed, not a measurement-
# only scaffold like QcFileReadExperiment.hpp was (ADR 0007). Its own
# worker thread's priority is overridden to match qc_wifi_web (10, below
# every protocol-timing-relevant thread - QcSession.hpp's
# kHeartbeatThreadPriority=5, QcPresetPrinter.hpp's kThreadPriority=9) -
# the default (0, Zephyr's highest) would otherwise let a slow immediate-
# mode log of every thread's stats preempt qc_heartbeat's own KeepAlive
# send, the exact failure mode this firmware's thread-priority discipline
# exists to avoid.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60
CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY_OVERRIDE=y
CONFIG_THREAD_ANALYZER_AUTO_THREAD_PRIORITY=10
