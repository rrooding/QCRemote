# Issue #71: the RW612's Wi-Fi driver and its SoftAP settings, split out of
# prj.conf (issue #76) so the same app also builds for the ESP32-S3.
# Modeled on Zephyr's own samples/net/wifi/apsta_mode sample + its boards/frdm_rw612.conf
# (CONFIG_WIFI_NXP/CONFIG_NXP_RW610 - RW610 and RW612 share the same
# wifi/BLE/802.15.4 radio silicon, Kconfig only distinguishes by that
# radio, not the MCU's own flash/pin variant), the only sample confirmed
# (via Zephyr's own test plan, samples/net/wifi/shell/tests.yaml) to build
# for this board. CONFIG_NXP_WIFI_SOFTAP_SUPPORT and its own DHCPv4 server
# (CONFIG_NXP_WIFI_SOFTAP_DHCP_SERVER) default on for this SoC series once
# WIFI_USAGE_MODE_AP/STA_AP is selected - confirmed on hardware (ac601b2)
# to be real, not just a default worth trusting blindly: this firmware
# used to *also* start its own app-layer DHCPv4 server on the same SoftAP
# interface, which collided with the driver's own (-EALREADY, "DHCP
# Server start failed"). That app-layer server is gone (see
# QcWifiWebTransport::startAccessPoint()'s own comment); the IP range
# below only overrides the driver's own default (192.168.10.x) to keep
# this firmware's documented 192.168.4.x range.
CONFIG_NXP_WIFI_SOFTAP_IP_ADDRESS="192.168.4.1"
CONFIG_NXP_WIFI_SOFTAP_IP_GATEWAY="192.168.4.1"
CONFIG_NXP_WIFI_SOFTAP_IP_MASK="255.255.255.0"
CONFIG_NXP_WIFI_SOFTAP_IP_BASE="192.168.4.11"
CONFIG_WIFI_NXP=y
CONFIG_NXP_RW610=y
