# The two 128 KiB message buffers (ADR 0007) don't fit the S3's internal
# RAM. 64 KiB still holds every message measured on the owner's unit (largest
# 22667 bytes, a RecallPreset push); only a near-full, fully-named folder
# would overflow. A board with PSRAM (the N16R8 module) could keep 128 KiB
# there instead - see ADR 0009.
CONFIG_QC_MESSAGE_CAPACITY=65536
