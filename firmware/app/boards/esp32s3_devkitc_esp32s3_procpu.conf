# 8 MB octal PSRAM (WROOM-1-N8R8/N16R8; RevA's N16R8 has the same). With
# Wi-Fi (issue #71) the app's static data doesn't fit the S3's internal RAM
# by ~160 KB, so all of libapp.a's .bss - the 128 KiB message buffers (ADR
# 0007), the catalog, the web transport's JSON buffers - moves to PSRAM.
# That includes the app's own thread stacks (K_KERNEL_STACK_MEMBERs inside
# those objects); fine as long as nothing runs from them with the flash
# cache disabled. For a module without PSRAM, see the _nopsram files.
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libapp.a"
