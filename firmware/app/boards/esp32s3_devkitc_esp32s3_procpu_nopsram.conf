# ESP32-S3 module without PSRAM (WROOM-1-N8/N16), -DFILE_SUFFIX=nopsram.
# USB host and the protocol only: Wi-Fi plus the web transport (issue #71)
# overflow the S3's internal RAM by ~160 KB without PSRAM, so this build's
# base config is prj_nopsram.conf, not prj.conf - it never assigns
# CONFIG_WIFI/CONFIG_NETWORKING/CONFIG_HTTP_SERVER in the first place (see
# that file's own comment). Main.cpp leaves the web transport out when
# CONFIG_WIFI is off.

# The two 128 KiB message buffers (ADR 0007) don't fit internal RAM either.
# 64 KiB still holds every message measured on the owner's unit (largest
# 22667 bytes, a RecallPreset push); only a near-full, fully-named folder
# would overflow.
CONFIG_QC_MESSAGE_CAPACITY=65536
