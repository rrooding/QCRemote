# Opt-in diagnostics for the network/HTTP path (issue #88, PR #92).
#
# NOT part of any normal build. Pass it explicitly, alongside the
# credentials file that firmware/app/CMakeLists.txt picks up on its own:
#
#   west build -b frdm_rw612 firmware/app -d build-diag --pristine \
#     -- -DEXTRA_CONF_FILE="diagnostics.conf"
#
# (If you keep a local wifi_credentials.conf, list both, semicolon
# separated: -DEXTRA_CONF_FILE="wifi_credentials.conf;diagnostics.conf".)
#
# Why this exists: PR #92's connection-concurrency bugs were all
# *resource budget* bugs - poll slots, client slots, net_contexts, and
# finally the TCP window against the net_buf pools - and two rounds of
# them were diagnosed from source and a loopback test, then found wrong
# on hardware. A loopback suite cannot model a 25-150ms RTT, which is
# exactly what makes a buffer budget bite. This fragment makes the board
# report the numbers instead, so the next round is measured.
#
# What to capture: flash this build, load the page, then grab the serial
# console. See firmware/README.md's "Parallel connections" section.

# Per-pool allocation counts and high-water marks for the net_buf pools,
# which is what the TCP window budget in prj.conf is sized against. With
# this on, a pool that ran dry shows up as a failed-allocation count
# rather than as a mysterious stall.
CONFIG_NET_BUF_POOL_USAGE=y

# TCP-level counters: retransmits, drops, connection drops. A starved
# pool shows up here as retransmits and segment drops climbing during a
# page load.
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_TCP=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=y
CONFIG_NET_STATISTICS_USER_API=y

# The net shell is how the two above get read out on demand ("net stats",
# "net mem", "net conn") rather than only on the periodic timer.
CONFIG_SHELL=y
CONFIG_NET_SHELL=y

# Stack headroom for every thread, so a silent overflow is ruled in or
# out rather than guessed at - zvfs_poll_internal() puts a
# k_poll_event[CONFIG_ZVFS_POLL_MAX] array on the stack of whichever
# thread calls poll(), and the HTTP server thread's own stack is only
# CONFIG_HTTP_SERVER_STACK_SIZE (3072 B). THREAD_ANALYZER is the same
# tool that produced the usbh and rx_q stack numbers quoted in prj.conf.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_NAME=y
CONFIG_INIT_STACKS=y

# A stack overflow should fault loudly and name the thread, not corrupt a
# neighbour silently.
CONFIG_STACK_SENTINEL=y

# The HTTP server's own debug logging: which client slot each connection
# lands in, when one is released, and "No free slot found" if the slots
# really are the constraint.
CONFIG_NET_LOG=y
CONFIG_NET_HTTP_SERVER_LOG_LEVEL_DBG=y
