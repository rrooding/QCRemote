CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Default ZTEST_STACK_SIZE overflows on qemu_cortex_m3 here too - same cause
# as catalog_messages/prj.conf's note: this suite's builder helpers return
# etl::vector<uint8_t, 2048> by value across a few stack frames, plus a
# std::vector<FilePreset> collecting results and 200/300-byte std::string
# fixtures for the long-name cases.
CONFIG_ZTEST_STACK_SIZE=16384
