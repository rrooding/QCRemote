CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Issue #71: this suite drives QcWifiWebTransport.hpp's real HTTP/WebSocket
# resources over a real TCP socket on the loopback interface, so the
# browser's own request sequence (GET / then GET /api/presets.json on the
# same keep-alive connection, plus a WebSocket upgrade) is exercised
# without a Wi-Fi driver or a board. Networking settings below are modeled
# on Zephyr's own tests/net/lib/http_server/core/prj.conf, which tests the
# same server the same way.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_DRIVERS=y
# Loopback only: without these, Zephyr's QEMU runner wires a SLIP serial
# device to a host socket (/tmp/slip.sock) that doesn't exist and QEMU
# refuses to start. CONFIG_NET_TEST, which Zephyr's own http_server test
# uses for the same purpose, is deliberately NOT used here - it replaces
# the websocket library's send path with a test hook
# (subsys/net/lib/websocket/websocket.c), and this suite needs the real
# one.
CONFIG_NET_QEMU_SLIP=n
CONFIG_NET_SLIP_TAP=n
CONFIG_NET_CONFIG_SETTINGS=n
# Issue #88 / PR #92: sized for BOTH ends of the loopback connection, not
# just the server's. The parallel-fetch tests open six client sockets of
# their own, so every per-connection pool here has to hold the server's
# share (1 listening socket + CONFIG_HTTP_SERVER_MAX_CLIENTS accepted)
# *plus* six client sockets *plus* whatever is still in TIME_WAIT - which
# is why these three cannot simply mirror ../../prj.conf's values the way
# the HTTP server settings below do. CONFIG_ZVFS_POLL_MAX can and does
# mirror it (10): only the server polls, so the app's own value is what
# gets exercised, and that is the setting PR #92's blocker came down to.
CONFIG_NET_MAX_CONTEXTS=48
CONFIG_NET_MAX_CONN=48
CONFIG_ZVFS_OPEN_MAX=56
# Mirrors ../../prj.conf's TCP window budget. Pinning the windows is
# the point: left at 0 they default to a third of the whole buffer
# pool *per connection*, which oversubscribes it for any more than
# three concurrent senders - see that file's own comment. Note that
# loopback cannot actually exercise this: with a microsecond RTT a
# buffer is allocated, sent, ACKed and freed before anything else
# needs it, so this suite would pass either way. It is mirrored here
# so the suite is not quietly testing a different TCP than the board
# runs.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=2048
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2048
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_TCP_TIME_WAIT_DELAY=0
CONFIG_NET_TCP_RETRY_COUNT=3
# QcWifiWebTransport.hpp reads the event's own wifi_status through
# net_mgmt_event_callback::info, which only exists under
# CONFIG_NET_MGMT_EVENT_INFO - same as the firmware's own prj.conf.
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ZVFS_POLL_MAX=10
CONFIG_EVENTFD=y
CONFIG_POSIX_API=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# The HTTP/WebSocket server settings have to match the app's own
# (../../prj.conf) - a client buffer size or client/context count that
# doesn't match the firmware's wouldn't be testing the firmware's
# behaviour.
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=8
CONFIG_HTTP_SERVER_COMPLETE_STATUS_PHRASES=y
# CONFIG_WEBSOCKET/CONFIG_WEBSOCKET_CLIENT come in via
# CONFIG_HTTP_SERVER_WEBSOCKET's own select, as they do in the firmware
# build - WEBSOCKET itself is a non-promptable helper symbol and can't be
# assigned here. That select also brings PSA_CRYPTO/PSA_WANT_ALG_SHA_1,
# which the upgrade's Sec-WebSocket-Accept hash needs.
CONFIG_WEBSOCKET_MAX_CONTEXTS=1
CONFIG_HTTP_SERVER_CLIENT_INACTIVITY_TIMEOUT=5

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZTEST_STACK_SIZE=8192
