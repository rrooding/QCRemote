CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Default ZTEST_STACK_SIZE (1024 on non-x86 targets, see
# subsys/testsuite/ztest/Kconfig) overflows on qemu_cortex_m3: confirmed by a
# real crash ("ESF could not be retrieved", a corrupted-stack fault) running
# this suite's SetlistPositionReply tests, whose struct carries three
# etl::string<96> fields (~300+ bytes) copied across a few stack frames plus
# zassert's own message-formatting buffer. Not a code bug - just more stack
# than Ztest's small default budgets for a non-x86 target.
CONFIG_ZTEST_STACK_SIZE=4096
