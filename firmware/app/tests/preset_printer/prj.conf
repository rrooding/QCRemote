CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# This suite's capacity-boundary tests build a source vector of up to
# QcPresetCatalog::kMaxPresetsPerFolder + 5 entries and copy into a
# kMaxPresetsPerFolder-sized std::array local - same reasoning as
# preset_catalog/prj.conf's own bump.
CONFIG_ZTEST_STACK_SIZE=16384
