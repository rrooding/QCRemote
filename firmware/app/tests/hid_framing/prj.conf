CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
# Left to auto-select an implementation per-platform (native_sim gets
# EXTERNAL_LIBCPP via its own host libc++/libstdc++; a real target like
# qemu_cortex_m3 would need NEWLIB_LIBC or PICOLIBC too - add explicitly
# if this alone isn't enough there).
CONFIG_REQUIRES_FULL_LIBCPP=y
