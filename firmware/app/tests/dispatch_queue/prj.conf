CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# The burst reproduction runs a cooperative producer thread at
# K_PRIO_COOP(0) against the dispatcher's own preemptible thread - that
# priority has to exist for the test to mean anything (it's what makes the
# consumer provably unable to run until the producer blocks, mirroring
# Zephyr's `usbh` thread at K_PRIO_COOP(9)). Zephyr's default of 16
# cooperative priorities already covers it; stated here so a future
# reduction fails loudly rather than quietly turning the producer
# preemptible.
CONFIG_NUM_COOP_PRIORITIES=16

# Default ZTEST_STACK_SIZE overflows here for the same reason
# ../dispatch_messages/prj.conf gives: zassert's own message formatting
# plus this suite's std::vector fixtures need more than the small default
# budget on a non-x86 target.
CONFIG_ZTEST_STACK_SIZE=16384
