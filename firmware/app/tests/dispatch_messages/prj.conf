CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Default ZTEST_STACK_SIZE overflows on qemu_cortex_m3 here too - same cause
# as file_messages/prj.conf's note: this suite's HandshakeMessageBuffer
# fixtures and zassert's own message-formatting buffer need more than the
# small default budgets for a non-x86 target.
CONFIG_ZTEST_STACK_SIZE=16384
