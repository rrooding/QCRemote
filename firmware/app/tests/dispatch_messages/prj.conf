CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Default ZTEST_STACK_SIZE overflows on qemu_cortex_m3 here too - same cause
# as file_messages/prj.conf's note: issue #33's variant-experiment tests
# build fixture File messages with the same etl::vector<uint8_t, 2048>
# by-value-returning helper. Raised again, 16384 -> 32768, once
# QcFileReadExperiment grew a per-folder table (QcFileReadExperiment::
# FolderDetail, kMaxFolders=16 entries of etl::string-based metadata) -
# every test declaring a plain `QcFileReadExperiment experiment;` local
# now puts several KB on this stack by itself, on top of the fixture
# buffers above.
CONFIG_ZTEST_STACK_SIZE=32768
