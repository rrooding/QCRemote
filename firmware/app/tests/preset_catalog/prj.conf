CONFIG_ZTEST=y

CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_CPP_EXCEPTIONS=n
CONFIG_CPP_RTTI=n

# Needed for <span>/STL - see the same setting in ../../prj.conf for why.
CONFIG_REQUIRES_FULL_LIBCPP=y

# Same cause as file_messages/prj.conf's note: this suite's FileMessage
# builder helpers return etl::vector<uint8_t, 2048> by value across a few
# stack frames, and the capacity-limit tests build a folder with up to
# QcPresetCatalog::kMaxPresetsPerFolder + a few extra presets in it.
CONFIG_ZTEST_STACK_SIZE=16384
