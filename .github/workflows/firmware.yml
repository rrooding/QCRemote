name: firmware

on:
  push:
    branches: [master]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Issue #46: the Zephyr version, both toolchains, the pinned v4.5.0
    # workspace (issue #86's narrowed `west update` project list), the
    # Wi-Fi/BLE blobs and the ESP32-S3 DWC2 patch are all baked into this
    # image - see ci/firmware/Dockerfile. Nothing here installs Zephyr
    # itself anymore.
    #
    # This is the one deliberate place the pinned toolchain changes: bump
    # ZEPHYR_VERSION in ci/firmware/Dockerfile, dispatch "publish firmware
    # CI image" with a new version tag, then update this tag to match.
    # firmware/README.md documents running the same image locally.
    #
    # The `env` context isn't available in `jobs.<id>.container.image`
    # (GitHub Actions limitation - confirmed by a real run failing with
    # "Unrecognized named-value: 'env'"), so this has to be a literal
    # rather than an env var substitution.
    container:
      image: ghcr.io/rrooding/qcremote-firmware:v4.5.0-1
    steps:
      - name: Check out QCRemote
        uses: actions/checkout@v7

      - name: Build frdm_rw612
        run: |
          cd "$ZEPHYR_WORKSPACE"
          west build -b frdm_rw612 "$GITHUB_WORKSPACE/firmware/app" --pristine
          # Nothing downstream needs this build tree, and keeping it around
          # left the runner disk-constrained by the time the ESP32-S3 builds
          # below run - confirmed as a real failure, not a hypothetical one:
          # GH run 41834770616 hit "Free space left: 89 MB" partway through
          # the second ESP32-S3 build and cmake's Ninja generator silently
          # wrote an incomplete build.ninja, which then failed as "No such
          # file or directory" instead of a clear disk-full error. Freeing
          # each --pristine build's tree before the next one starts keeps
          # that from recurring.
          rm -rf "$ZEPHYR_WORKSPACE/build"

      # Issue #76 / ADR 0009's DWC2 driver patch and the Wi-Fi/BLE blobs are
      # already baked into the image (ci/firmware/Dockerfile) - nothing to
      # apply or fetch here.
      - name: Build esp32s3_devkitc
        run: |
          cd "$ZEPHYR_WORKSPACE"
          # Default board config: PSRAM module, Wi-Fi on (issue #71). The ESP
          # Wi-Fi driver needs hal_espressif's blobs (~40 MB, every chip);
          # BUILD_ONLY_NO_BLOBS is Zephyr's own switch for building it in CI
          # without them - the image links but isn't meant to run.
          west build -b esp32s3_devkitc/esp32s3/procpu "$GITHUB_WORKSPACE/firmware/app" -d build-esp32s3 --pristine \
            -- -DCONFIG_BUILD_ONLY_NO_BLOBS=y
          # See the disk-space comment on the frdm_rw612 step above - same
          # reason, between these two --pristine builds instead of after.
          rm -rf "$ZEPHYR_WORKSPACE/build-esp32s3"
          # Module without PSRAM: USB only, Wi-Fi off.
          west build -b esp32s3_devkitc/esp32s3/procpu "$GITHUB_WORKSPACE/firmware/app" -d build-esp32s3-nopsram --pristine \
            -- -DFILE_SUFFIX=nopsram

      - name: Run firmware Ztest suites (native_sim)
        run: |
          cd "$ZEPHYR_WORKSPACE"
          west twister -p native_sim -T "$GITHUB_WORKSPACE/firmware/app/tests"
